const ui = $('capas'), svg = $('lineas'), etiquetas = {};

const capEl = $('cap'); let capHtml = '';
const esc = x => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fmt = x => esc(x).replace(/\*(.+?)\*/g, '<b>$1</b>');

// se enciende al decirse), 'pastilla' (frase corta en caja negra), 'caja' (cuadro de diálogo de videojuego).
const ESTILO = TL.subtitulos || 'arriba';
if (ESTILO !== 'arriba') capEl.classList.add(ESTILO);
// En los formatos de redes el subtítulo cambia 0,08 s antes de la palabra: así un corte en c() - .06 ya trae el subtítulo nuevo.
const ADEL = ESTILO === 'arriba' ? .05 : .08;
const palabras = cap => cap.replace(/\*(.+?)\*/g, (_, x) => x.split(' ').map(w => '\u0001' + w).join(' ')).split(' ').filter(Boolean);

  let html = '', a = 0, dy = 0, es = 1;

      if (t >= ch.t0 - ADEL && t < t1 - ADEL) {

        else {

          if (ESTILO === 'caja') { html = `<u>${esc(rotulo(sc.habla))}</u>` + pal.filter(p => p.dicha).map(p => p.r ? `<b>${p.x}</b>` : p.x).join(' '); a = 1; dy = 0; }
          else { html = pal.map(p => `<span class="${p.dicha ? 'd' : ''}${p.r ? ' r' : ''}">${p.x}</span>`).join(''); dy = 0; es = .9 + .1 * eo(u); }
